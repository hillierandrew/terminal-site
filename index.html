<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍄 ANDREW HILLIER 🌀</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --acid-green: #39ff14;
            --trippy-pink: #ff007f;
            --electric-purple: #9d00ff;
            --cosmic-blue: #00f0ff;
            --dark-void: #020205;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-void);
            color: var(--cosmic-blue);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 10px;
            overflow-x: hidden;
            position: relative;
        }

        /* Fullscreen Kaleidoscope Hypno-Canvas Background */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Screen Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.08), rgba(0, 255, 0, 0.04), rgba(0, 0, 255, 0.08));
            z-index: 10;
            background-size: 100% 6px, 6px 100%;
            pointer-events: none;
        }

        /* Psychedelic Melting Container */
        .psycho-container {
            width: 100%;
            max-width: 480px;
            background: rgba(10, 5, 20, 0.85);
            border: 2px solid var(--trippy-pink);
            padding: 25px 15px;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 40px var(--electric-purple), inset 0 0 20px rgba(0, 240, 255, 0.2);
            margin-top: 15px;
            margin-bottom: 40px;
            animation: containerFloat 8s ease-in-out infinite;
            border-radius: 20px 4px 20px 4px;
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); border-color: var(--trippy-pink); }
            33% { transform: translateY(-6px) rotate(0.5deg); border-color: var(--acid-green); }
            66% { transform: translateY(4px) rotate(-0.5deg); border-color: var(--cosmic-blue); }
        }

        .fluid-header {
            text-align: center;
            position: relative;
            margin-bottom: 30px;
        }

        /* Breathing Name Heading */
        .main-header {
            font-size: 38px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            position: relative;
            animation: meltText 4s ease-in-out infinite;
            text-shadow: 3px 3px var(--trippy-pink), -3px -3px var(--cosmic-blue);
        }

        @keyframes meltText {
            0%, 100% { transform: scale(1) skewX(0deg); text-shadow: 3px 3px var(--trippy-pink), -3px -3px var(--cosmic-blue); }
            50% { transform: scale(1.05) skewX(-4deg); text-shadow: -3px 3px var(--acid-green), 3px -3px var(--electric-purple); color: var(--cosmic-blue); }
        }

        .header-decor {
            font-size: 24px;
            display: block;
            margin-top: 5px;
            animation: spinDecor 6s linear infinite;
        }

        @keyframes spinDecor {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .social-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Interacting Reality Link Modules */
        .social-item {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(20, 10, 35, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 18px;
            text-decoration: none;
            color: var(--cosmic-blue);
            position: relative;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
        }

        .social-item::after {
            content: '🌀';
            position: absolute;
            right: 15px;
            opacity: 0.2;
            transition: all 0.3s ease;
        }

        /* Trip Hover Adjustments */
        .social-item:hover {
            color: #fff;
            background-color: var(--electric-purple);
            border-color: var(--acid-green);
            box-shadow: 0 0 25px var(--acid-green), inset 0 0 10px #fff;
            transform: scale(1.03) rotate(1deg);
        }

        .social-item:hover::after {
            opacity: 1;
            transform: rotate(360deg) scale(1.4);
        }

        .social-item:nth-child(even):hover {
            background-color: var(--trippy-pink);
            transform: scale(1.03) rotate(-1deg);
            box-shadow: 0 0 25px var(--cosmic-blue), inset 0 0 10px #fff;
        }

        .social-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .social-label i {
            font-size: 20px;
            color: var(--trippy-pink);
            transition: transform 0.3s ease;
        }

        .social-item:hover i {
            transform: scale(1.3) rotate(-20deg);
            color: var(--acid-green);
        }

        @media (min-width: 768px) {
            body {
                align-items: center;
                padding: 40px;
            }
            .psycho-container {
                padding: 40px;
            }
            .main-header {
                font-size: 54px;
                letter-spacing: 6px;
            }
            .social-label {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <script>
        // --- 1. THE GLYPH SHIFT SCRAMBLER MOTOR ---
        const components = "%&#§10?*@$▲▼🌀👁️🍄";
        const items = document.querySelectorAll('.social-item');

        items.forEach(item => {
            const node = item.querySelector('.text-node');
            const primaryString = item.getAttribute('data-text');
            let interval = null;

            item.addEventListener('mouseenter', () => {
                let iteration = 0;
                clearInterval(interval);
                
                interval = setInterval(() => {
                    node.innerText = primaryString.split("")
                        .map((char, index) => {
                            if(index < iteration) {
                                return primaryString[index];
                            }
                            return components[Math.floor(Math.random() * components.length)];
                        })
                        .join("");
                    
                    if(iteration >= primaryString.length) { 
                        clearInterval(interval);
                    }
                    iteration += 1 / 3;
                }, 25);
            });

            item.addEventListener('mouseleave', () => {
                clearInterval(interval);
                node.innerText = primaryString;
            });
        });

        // --- 2. PLASMA MATHEMATICAL VISUALIZER ---
        const canvas = document.getElementById('trip-matrix');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        let time = 0;
        
        function animatePlasma() {
            const width = canvas.width;
            const height = canvas.height;
            
            ctx.fillStyle = 'rgba(2, 2, 5, 0.08)';
            ctx.fillRect(0, 0, width, height);

            const gridCount = 28;
            const spacingX = width / gridCount;
            const spacingY = height / gridCount;

            time += 0.02;

            for (let x = 0; x <= gridCount; x++) {
                for (let y = 0; y <= gridCount; y++) {
                    const posX = x * spacingX;
                    const posY = y * spacingY;

                    const wave1 = Math.sin(x * 0.15 + time);
                    const wave2 = Math.cos(y * 0.15 - time);
                    const wave3 = Math.sin((x + y) * 0.1 + time * 0.5);
                    const totalWave = (wave1 + wave2 + wave3) / 3;

                    const radius = Math.abs(totalWave) * 16 + 2;
                    const offsetX = Math.sin(y + time) * 12;
                    const offsetY = Math.cos(x - time) * 12;

                    const r = Math.floor(127 + 127 * Math.sin(time + posX * 0.002));
                    const g = Math.floor(127 + 127 * Math.cos(time + posY * 0.002));
                    const b = Math.floor(200 + 55 * Math.sin(time));

                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.25)`;
                    
                    ctx.beginPath();
                    ctx.arc(posX + offsetX, posY + offsetY, radius, 0, Math.PI * 2);
                    ctx.fill();

                    if (Math.random() > 0.997) {
                        ctx.strokeStyle = 'rgba(57, 255, 20, 0.4)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(posX, posY);
                        ctx.lineTo(posX + offsetX * 4, posY + offsetY * 4);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animatePlasma);
        }
        animatePlasma();
    </script>
</body>
