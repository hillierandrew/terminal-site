<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root {
            --glow-color: #00FF41;
            --bg-color: #050b06;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--glow-color);
            font-family: 'VT323', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        /* Starfield Canvas Background */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Retro CRT Glass Overlays */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            z-index: 11;
            pointer-events: none;
        }

        .terminal-container {
            width: 100%;
            max-width: 900px;
            text-shadow: 0 0 4px rgba(0, 255, 65, 0.6);
            z-index: 2;
        }

        .main-header {
            text-align: center;
            font-size: 56px;
            font-weight: normal;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--glow-color);
        }

        .social-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(0, 255, 65, 0.4);
            background: rgba(5, 11, 6, 0.8);
            padding: 12px 15px;
            text-decoration: none;
            color: var(--glow-color);
            transition: all 0.15s ease;
        }

        .social-item:hover {
            background-color: var(--glow-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--glow-color);
            text-shadow: none;
        }

        .social-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
        }

        .social-label i {
            width: 24px;
            text-align: center;
        }

        .social-handle {
            font-size: 24px;
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Desktop Layout Rules */
        @media (min-width: 768px) {
            .main-header {
                font-size: 84px;
                margin-bottom: 30px;
            }
            .social-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px 30px;
            }
            .social-item {
                padding: 10px 20px;
            }
            .social-label, .social-handle {
                font-size: 26px;
            }
        }
    </style>
</head>

    <script>
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Retro Starfield Flight Config
        const numStars = 150;
        const stars = [];

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * 2 - 1,
                y: Math.random() * 2 - 1,
                z: Math.random()
            });
        }

        function animate() {
            ctx.fillStyle = '#050b06';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.fillStyle = '#00FF41';

            for (let i = 0; i < numStars; i++) {
                const star = stars[i];
                star.z -= 0.005; // Fly forward speed

                if (star.z <= 0) {
                    star.x = Math.random() * 2 - 1;
                    star.y = Math.random() * 2 - 1;
                    star.z = 1;
                }

                // 3D Perspective math projection
                const px = (star.x / star.z) * cx + cx;
                const py = (star.y / star.z) * cy + cy;
                const size = (1 - star.z) * 4;

                if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
