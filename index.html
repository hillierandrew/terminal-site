html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --dark-panel: rgba(10, 16, 26, 0.85);
            --bg-solid: #03070d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-solid);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(3, 7, 13, 0.7) 100%);
            z-index: 11;
            pointer-events: none;
        }

        .cyber-container {
            width: 100%;
            max-width: 950px;
            background: var(--dark-panel);
            border-left: 4px solid var(--neon-magenta);
            border-right: 1px solid rgba(0, 243, 255, 0.2);
            border-top: 1px solid rgba(0, 243, 255, 0.2);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding: 25px;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1), inset 0 0 15px rgba(0, 243, 255, 0.05);
            clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%);
        }

        .corner-tag {
            position: absolute;
            top: 6px;
            left: 12px;
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(0, 243, 255, 0.4);
        }

        .main-header {
            text-align: center;
            font-size: 46px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 15px 0 30px 0;
            position: relative;
            text-shadow: 2px 2px var(--neon-magenta), -2px -2px var(--neon-cyan);
        }

        .social-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .social-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(13, 22, 37, 0.7);
            border: 1px solid rgba(0, 243, 255, 0.25);
            padding: 14px 18px;
            text-decoration: none;
            color: var(--neon-cyan);
            position: relative;
            transition: all 0.2s cubic-bezier(0.165, 0.84, 0.44, 1);
            overflow: hidden;
        }

        .social-item::before {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 0; height: 0;
            border-style: solid;
            border-width: 0 0 8px 8px;
            border-color: transparent transparent var(--neon-cyan) transparent;
            transition: all 0.2s ease;
        }

        .social-item:hover {
            color: #03070d;
            background-color: var(--neon-cyan);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
            transform: scale(1.01);
        }

        .social-item:hover::before {
            border-color: transparent transparent var(--neon-magenta) transparent;
        }

        .social-label {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .social-label i {
            width: 24px;
            text-align: center;
            color: var(--neon-magenta);
            transition: color 0.2s ease;
        }

        .social-item:hover i {
            color: #03070d;
        }

        .social-handle {
            font-size: 20px;
            opacity: 0.9;
        }

        @media (min-width: 768px) {
            body {
                padding: 40px;
            }
            .cyber-container {
                padding: 40px;
            }
            .main-header {
                font-size: 74px;
                margin-bottom: 40px;
                letter-spacing: 6px;
            }
            .social-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px 30px;
            }
            .social-item {
                padding: 12px 20px;
            }
            .social-label, .social-handle {
                font-size: 22px;
            }
        }
    </style>
</head>

    <script>
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const numStars = 140;
        const stars = [];

        for (let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * 2 - 1,
                y: Math.random() * 2 - 1,
                z: Math.random()
            });
        }

        function animate() {
            ctx.fillStyle = '#03070d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.fillStyle = '#00f3ff';

            for (let i = 0; i < numStars; i++) {
                const star = stars[i];
                star.z -= 0.004; 

                if (star.z <= 0) {
                    star.x = Math.random() * 2 - 1;
                    star.y = Math.random() * 2 - 1;
                    star.z = 1;
                }

                const px = (star.x / star.z) * cx + cx;
                const py = (star.y / star.z) * cy + cy;
                const size = (1 - star.z) * 3.5;

.if (px >= 0 && px <= canvas.width && py >= 0 && py <= canvas.height) {ctx.beginPath();ctx.arc(px, py, size, 0, Math.PI * 2);ctx.fill();}}requestAnimationFrame(animate);}animate();
