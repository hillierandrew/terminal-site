<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew Hillier</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --dark-panel: rgba(10, 16, 26, 0.9);
            --bg-solid: #03070d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-solid);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 10px;
            overflow-x: hidden;
            position: relative;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(3, 7, 13, 0.7) 100%);
            z-index: 11;
            pointer-events: none;
        }

        .cyber-container {
            width: 100%;
            max-width: 500px;
            background: var(--dark-panel);
            border-left: 4px solid var(--neon-magenta);
            border-right: 1px solid rgba(0, 243, 255, 0.2);
            border-top: 1px solid rgba(0, 243, 255, 0.2);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding: 20px;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1), inset 0 0 15px rgba(0, 243, 255, 0.05);
            clip-path: polygon(0 0, 93% 0, 100% 4%, 100% 100%, 7% 100%, 0 96%);
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .corner-tag {
            position: absolute;
            top: 6px;
            left: 12px;
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(0, 243, 255, 0.4);
        }

        .main-header {
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 25px 0 25px 0;
            position: relative;
            text-shadow: 2px 2px var(--neon-magenta), -2px -2px var(--neon-cyan);
            line-height: 1.1;
        }

        .social-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-item {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(13, 22, 37, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.25);
            padding: 16px;
            text-decoration: none;
            color: var(--neon-cyan);
            position: relative;
            transition: all 0.2s cubic-bezier(0.165, 0.84, 0.44, 1);
            overflow: hidden;
        }

        .social-item::before {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 0; height: 0;
            border-style: solid;
            border-width: 0 0 8px 8px;
            border-color: transparent transparent var(--neon-cyan) transparent;
            transition: all 0.2s ease;
        }

        .social-item:hover {
            color: #03070d;
            background-color: var(--neon-cyan);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
        }

        .social-item:hover::before {
            border-color: transparent transparent var(--neon-magenta) transparent;
        }

        .social-label {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .social-label i {
            width: 24px;
            text-align: center;
            color: var(--neon-magenta);
            transition: color 0.2s ease;
        }

        .social-item:hover i {
            color: #03070d;
        }

        @media (min-width: 768px) {
            body {
                align-items: center;
                padding: 30px;
            }
            .cyber-container {
                padding: 35px;
                margin-top: 0;
                margin-bottom: 0;
            }
            .main-header {
                font-size: 54px;
                margin-bottom: 30px;
                letter-spacing: 5px;
            }
            .social-item {
                padding: 14px;
            }
            .cyber-container {
                max-width: 600px;
            }
            .social-label {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <canvas id="digital-rain"></canvas>

    <div class="cyber-container">
        <div class="corner-tag">NET.CORE // UNSECURED_RELAY</div>
        
        <h1 class="main-header">ANDREW HILLIER</h1>

        <div class="social-grid">
            <a href="mailto:email@andrewhillier.ca" class="social-item">
                <span class="social-label"><i class="fa-regular fa-envelope"></i>EMAIL</span>
            </a>

            <a href="https://x.com/drew" target="_blank" class="social-item">
                <span class="social-label"><i class="fa-brands fa-x-twitter"></i>X / TWITTER</span>
            </a>

            <a href="https://instagram.com/drew" target="_blank" class="social-item">
                <span class="social-label"><i class="fa-brands fa-instagram"></i>INSTAGRAM</span>
            </a>

            <a href="https://threads.net/@drew" target="_blank" class="social-item">
                <span class="social-label"><i class="fa-brands fa-threads"></i>THREADS</span>
            </a>

            <a href="https://facebook.com/drew" target="_blank" class="social-item">
                <span class="social-label"><i class="fa-brands fa-facebook-f"></i>FACEBOOK</span>
            </a>

            <a href="https://bluesky.app" target="_blank" class="social-item">
                <span class="social-label"><i class="fa-solid fa-cloud"></i>BLUESKY</span>
            </a>

            <a href="https://reddit.com/u/drew" target="_blank" class="social-item">
                <span class="social-label"><i class="fa-brands fa-reddit-alien"></i>REDDIT</span>
            </a>

            <a href="https://twitch.tv/drew" target="_blank" class="social-item">
                <span class="social-label"><i class="fa-brands fa-twitch"></i>TWITCH</span>
            </a>

            <a href="https://discord.com" target="_blank" class="social-item">
                <span class="social-label"><i class="fa-brands fa-discord"></i>DISCORD</span>
            </a>

            <a href="https://linkedin.com/in/andrewhillier" target="_blank" class="social-item">
                <span class="social-label"><i class="fa-brands fa-linkedin-in"></i>LINKEDIN</span>
            </a>

            <a href="https://youtube.com" target="_blank" class="social-item">
                <span class="social-label"><i class="fa-brands fa-youtube"></i>YOUTUBE</span>
            </a>

            <a href="https://snapchat.com" target="_blank" class="social-item">
                <span class="social-label"><i class="fa-brands fa-snapchat"></i>SNAPCHAT</span>
            </a>

            <a href="https://tiktok.com" target="_blank" class="social-item">
                <span class="social-label"><i class="fa-brands fa-tiktok"></i>TIKTOK</span>
            </a>

            <a href="https://telegram.org" target="_blank" class="social-item">
                <span class="social-label"><i class="fa-solid fa-paper-plane"></i>TELEGRAM</span>
            </a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('digital-rain');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const chars = "0101011001XX//__--++==##%%";
        const charArr = chars.split("");
        
        const fontSize = 16;
        let columns = canvas.width / fontSize;

        const rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = Math.random() * -100;
        }

        function draw() {
            ctx.fillStyle = 'rgba(3, 7, 13, 0.06)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00f3ff';
            ctx.font = fontSize + 'px monospace';

            columns = canvas.width / fontSize;
            if (rainDrops.length < columns) {
                for (let i = rainDrops.length; i < columns; i++) {
                    rainDrops[i] = Math.random() * -100;
                }
            }

            for (let i = 0; i < rainDrops.length; i++) {
                const text = charArr[Math.floor(Math.random() * charArr.length)];
                if (rainDrops[i] > 0) {
                    ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                }

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.98) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }

        setInterval(draw, 33);
    </script>
</body>
</html>
