<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANDREW HILLIER</title>
  <style>
    :root {
      --crt-green: #33ff33;
      --crt-dim: #116611;
      --crt-bg: #050a05;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: var(--crt-green);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Screen Curvature & Vignette */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, transparent 60%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
      z-index: 10;
    }

    /* Scanlines */
    body::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 11;
    }

    .container {
      text-align: center;
      z-index: 2;
      padding: 20px;
    }

    /* CRT Phosphor Glow & Flicker */
    .title {
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: bold;
      letter-spacing: 0.15em;
      text-shadow: 0 0 8px var(--crt-green), 0 0 20px var(--crt-dim);
      animation: flicker 0.15s infinite;
      min-height: 1.2em;
      user-select: none;
      white-space: nowrap;
    }

    .contact-btn {
      margin-top: 2rem;
      background: transparent;
      color: var(--crt-green);
      border: 1px solid var(--crt-green);
      padding: 8px 24px;
      font-family: inherit;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      cursor: pointer;
      text-shadow: 0 0 5px var(--crt-green);
      box-shadow: 0 0 5px var(--crt-dim);
      transition: all 0.2s ease;
    }

    .contact-btn:hover {
      background: var(--crt-green);
      color: #000;
      box-shadow: 0 0 15px var(--crt-green);
    }

    /* Minimal Contact Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 20;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      border: 1px solid var(--crt-green);
      background: var(--crt-bg);
      padding: 30px;
      text-align: center;
      box-shadow: 0 0 20px var(--crt-dim);
    }

    .modal-content a {
      color: var(--crt-green);
      text-decoration: none;
      font-size: 1.1rem;
      display: block;
      margin: 15px 0;
      text-shadow: 0 0 8px var(--crt-green);
    }

    .modal-content a:hover {
      text-decoration: underline;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--crt-green);
      font-family: inherit;
      cursor: pointer;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      opacity: 0.7;
    }

    .close-btn:hover {
      opacity: 1;
    }

    @keyframes flicker {
      0% { opacity: 0.97; }
      50% { opacity: 1; }
      100% { opacity: 0.98; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="scramble-text" class="title">ANDREW HILLIER</div>
    <button class="contact-btn" onclick="toggleModal(true)">[ CONTACT ]</button>
  </div>

  <div id="contact-modal" class="modal">
    <div class="modal-content">
      <p style="letter-spacing: 0.1em; font-size: 0.8rem; opacity: 0.8;">DIRECTORY</p>
      <a href="mailto:email@andrewhillier.ca">email@andrewhillier.ca</a>
      <button class="close-btn" onclick="toggleModal(false)">[ CLOSE ]</button>
    </div>
  </div>

  <script>
    const targetText = "ANDREW HILLIER";
    const el = document.getElementById("scramble-text");

    // Leet replacements and glitch symbols
    const leetMap = { 'A': ['@', '4'], 'E': ['3'], 'I': ['1', '!'], 'O': ['0'], 'R': ['R', 'r'], 'S': ['5'] };
    const glitchChars = "0137_/#\\|@$%&*";

    // Static preset states from your sequence for variety
    const presets = [
      "ANDREW HILLIER", "ANDREW HILILER", "ANDEW HIRLIER", "ANDR3W H1LLI3R",
      "@ndr3w hi11iEr", "ANDREW HILL1ER", "4NDR3W HILLIER", "ANDRWE HILLIER",
      "ANDREW HI1LIER", "@NDR3W H1LLI3R", "ANDREW HILRIEH", "4NDR3W HI11IER",
      "ANDR3W HILLI3R", "ANDREW HILIIER", "@ndr3w H1LL1ER", "ANDREW HLLIIER",
      "4NDR3W HIL1ER", "ANDREW HILILER", "@NDR3W HILLI3R", "ANDREW HIILLER",
      "ANDR3W H1LI3R", "@ndr3w hi11i3r", "ANDREW HIL_LIER", "4NDR3W HILLI3R",
      "ANDREW HIRLIER", "@NDR3W HIL1IER", "ANDR EW HILLIER", "4ndr3w hi11iEr",
      "ANDREW HILIILER", "ANDR3W H1LLIER", "@ndr3w HIL1I3R", "ANDREW HILLIE_R",
      "4NDR3W H1LL1ER", "ANDREW HILRER", "@NDR3W HILIIER", "ANDR3W HIL1ER",
      "ANDREW HILLlER", "4ndr3w hi11i3r", "ANDREW HILILRE", "@NDR3W H1LLI3R_",
      "ANDRWE HIL1IER", "4NDR3W HILII3R", "ANDREW H1LLIER", "@ndr3w hi11iEr",
      "ANDR3W HLLI3R", "4NDR3W H1LIER", "ANDREW HILILER", "@NDR3W HILLI3R",
      "ANDR3W HI11IER", "4ndr3w H1LL1Er", "ANDREW HIRL1ER", "@ndr3w HILII3R",
      "4NDR3W HILL1ER", "ANDR3W HILRIEH", "@NDR3W H1LLIER", "ANDREW HIL1I3R",
      "4ndr3w hi11iEr", "ANDRWE H1LLI3R", "@NDR3W HIL1ER", "ANDREW HILLIER"
    ];

    function generateAlgorithmicGlitch() {
      return targetText.split('').map(char => {
        if (char === ' ') return ' ';
        const rand = Math.random();
        if (rand < 0.3 && leetMap[char]) {
          const options = leetMap[char];
          return options[Math.floor(Math.random() * options.length)];
        } else if (rand < 0.5) {
          return glitchChars[Math.floor(Math.random() * glitchChars.length)];
        }
        return Math.random() < 0.5 ? char.toLowerCase() : char;
      }).join('');
    }

    function runScrambleCycle() {
      // Hold clean target text for 2.5 seconds
      el.textContent = targetText;
      
      setTimeout(() => {
        let frame = 0;
        const totalFrames = 30 + Math.floor(Math.random() * 20); // 30-50 fast rapid shifts
        
        const interval = setInterval(() => {
          // Mix predefined leet list with fully algorithmic glitched frames
          if (Math.random() < 0.6) {
            el.textContent = presets[Math.floor(Math.random() * presets.length)];
          } else {
            el.textContent = generateAlgorithmicGlitch();
          }
          
          frame++;
          if (frame >= totalFrames) {
            clearInterval(interval);
            el.textContent = targetText;
            runScrambleCycle(); // Loop next burst
          }
        }, 60); // Speed of character switches (ms)
      }, 2500);
    }

    function toggleModal(show) {
      document.getElementById('contact-modal').style.display = show ? 'flex' : 'none';
    }

    // Start loop
    runScrambleCycle();
  </script>
</body>
</html>
