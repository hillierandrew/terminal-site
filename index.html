<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --acid-green: #39ff14;
            --dark-panel: rgba(10, 16, 26, 0.9);
            --bg-solid: #03070d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-solid);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 10px;
            overflow-x: hidden;
            position: relative;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(3, 7, 13, 0.7) 100%);
            z-index: 11;
            pointer-events: none;
        }

        .cyber-container {
            width: 100%;
            max-width: 500px;
            background: var(--dark-panel);
            border-left: 4px solid var(--neon-magenta);
            border-right: 1px solid rgba(0, 243, 255, 0.2);
            border-top: 1px solid rgba(0, 243, 255, 0.2);
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding: 20px;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1), inset 0 0 15px rgba(0, 243, 255, 0.05);
            clip-path: polygon(0 0, 93% 0, 100% 4%, 100% 100%, 7% 100%, 0 96%);
            margin-top: 10px;
            margin-bottom: 30px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(0.5deg); }
        }

        .corner-tag {
            position: absolute;
            top: 6px;
            left: 12px;
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(0, 243, 255, 0.4);
        }

        .main-header {
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 25px 0 25px 0;
            position: relative;
            text-shadow: 2px 2px var(--neon-magenta), -2px -2px var(--neon-cyan);
            line-height: 1.1;
            animation: textWobble 4s ease-in-out infinite;
        }

        @keyframes textWobble {
            0%, 100% { transform: skewX(0deg); text-shadow: 2px 2px var(--neon-magenta), -2px -2px var(--neon-cyan); }
            50% { transform: skewX(-3deg) scale(1.02); text-shadow: -2px 2px var(--acid-green), 2px -2px var(--neon-magenta); }
        }

        .social-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-item {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(13, 22, 37, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.25);
            padding: 16px;
            text-decoration: none;
            color: var(--neon-cyan);
            position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            border-radius: 6px;
        }

        .social-item::before {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 0; height: 0;
            border-style: solid;
            border-width: 0 0 8px 8px;
            border-color: transparent transparent var(--neon-cyan) transparent;
            transition: all 0.2s ease;
        }

        .social-item:hover {
            color: #fff;
            background-color: var(--neon-magenta);
            border-color: var(--acid-green);
            box-shadow: 0 0 25px var(--acid-green);
            transform: scale(1.03) rotate(1deg);
        }

        .social-item:nth-child(even):hover {
            background-color: var(--neon-cyan);
            color: var(--bg-solid);
            transform: scale(1.03) rotate(-1deg);
            box-shadow: 0 0 25px var(--neon-magenta);
        }

        .social-item:hover::before {
            border-color: transparent transparent var(--neon-magenta) transparent;
        }

        .social-label {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .social-label i {
            width: 24px;
            text-align: center;
            color: var(--neon-magenta);
            transition: all 0.3s ease;
        }

        .social-item:hover i {
            transform: scale(1.3) rotate(15deg);
            color: var(--acid-green);
        }

        @media (min-width: 768px) {
            body {
                align-items: center;
                padding: 30px;
            }
            .cyber-container {
                padding: 35px;
                margin-top: 0;
                margin-bottom: 0;
            }
            .main-header {
                font-size: 54px;
                margin-bottom: 30px;
                letter-spacing: 5px;
            }
            .social-item {
                padding: 14px;
            }
            .social-label {
                font-size: 24px;
            }
        }
    </style>
</head>

    <script>
        const canvas = document.getElementById('trip-plasma');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        let time = 0;

        function animatePlasma() {
            ctx.fillStyle = 'rgba(3, 7, 13, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const gridCount = 25;
            const spacingX = canvas.width / gridCount;
            const spacingY = canvas.height / gridCount;

            time += 0.02;

            for (let x = 0; x <= gridCount; x++) {
                for (let y = 0; y <= gridCount; y++) {
                    const posX = x * spacingX;
                    const posY = y * spacingY;

                    const wave1 = Math.sin(x * 0.15 + time);
                    const wave2 = Math.cos(y * 0.15 - time);
                    const wave3 = Math.sin((x + y) * 0.1 + time * 0.5);
                    const totalWave = (wave1 + wave2 + wave3) / 3;

                    const radius = Math.abs(totalWave) * 18 + 2;
                    const offsetX = Math.sin(y + time) * 14;
                    const offsetY = Math.cos(x - time) * 14;

                    const r = Math.floor(127 + 127 * Math.sin(time + posX * 0.002));
                    const g = Math.floor(127 + 127 * Math.cos(time + posY * 0.002));
                    const b = Math.floor(200 + 55 * Math.sin(time));

                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.22)`;
                    
                    ctx.beginPath();
                    ctx.arc(posX + offsetX, posY + offsetY, radius, 0, Math.PI * 2);
                    ctx.fill();

                    if (Math.random() > 0.998) {
                        ctx.strokeStyle = 'rgba(57, 255, 20, 0.3)';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(posX, posY);
                        ctx.lineTo(posX + offsetX * 3, posY + offsetY * 3);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animatePlasma);
        }
        animatePlasma();
    </script>
